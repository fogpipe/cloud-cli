name: release

# Build fpcloud for each platform, publish the binaries to a GitHub Release, and
# point the Homebrew formula at the new version. No credential is
# injected: the Google client secret lives on the platform, which brokers the
# token exchange, so a release binary is what anyone gets from `go build`.
# Trigger by pushing a tag, e.g.:  git tag v0.1.0 && git push origin v0.1.0
#
# Single job (not a matrix): all targets build in one runner and the release is
# created in one call. A matrix raced here — every job tried to create the same
# release and collided with "already_exists". One job, one create = no race.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history + tags so the changelog can diff against the previous tag
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Build all platforms
        env:
          # Through the environment, never interpolated into the script: a tag is
          # attacker-chosen text, and `${{ }}` is substituted before the shell
          # parses the line, so a tag containing a quote would run as code.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # CGO_ENABLED=0 → fully static binaries on every target (no libc
          # dependency), so the CLI runs anywhere: NixOS, Alpine/musl, old glibc.
          # Without it the native linux/amd64 build links glibc dynamically and
          # won't run on those. fpcloud is pure Go, so nothing needs cgo.
          export CGO_ENABLED=0
          # No credential is injected: the Google client secret lives on the
          # platform, which brokers the token exchange, so a release binary is
          # byte-identical to what anyone can build from this tag.
          pkg=github.com/fogpipe/cloud-cli/pkg/cli
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            out="fpcloud-${GOOS}-${GOARCH}"
            go build -ldflags "-X $pkg.version=$TAG" -o "$out" ./cmd/fpcloud
            sha256sum "$out" > "$out.sha256"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes \
            fpcloud-* \
          || gh release upload "$TAG" fpcloud-* --clobber

      # The formula needs the built assets' hashes, so it cannot exist before the
      # release does. The Nix package's version is stamped into the tagged commit
      # itself by the workspace's release recipe — a nix build from a tag used to
      # state the previous release's number, which is what the API's client floor
      # reads (fogpipe/cloud-workspace#859). This step re-states it on `main` as
      # well, because `main` is what a nix user tracking the branch resolves.
      #
      # Authored on `main` rather than on the tag (fogpipe/cloud-workspace#898).
      # The tag is a SIBLING of main's last formula commit, not a descendant: the
      # release recipe stamps package.nix on top of the green cli commit it chose
      # and tags THAT, while the previous release's formula commit landed on main
      # separately. So the tag's copy of the formula is a release or more stale —
      # v0.177.0's tag read 0.175.0 against a main reading 0.176.0 — and rebasing
      # a rewrite of the stale copy onto main conflicted on the version and hash
      # lines. Checking main out first means there is nothing to rebase, so the
      # conflict cannot exist rather than being handled.
      - name: Update Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          git config user.name "fogpipe-release"
          git config user.email "release@fogpipe.com"
          # The built assets are untracked, so they survive the checkout and are
          # still here to be hashed.
          git fetch origin main
          git checkout -B release-formula FETCH_HEAD
          python3 - "$ver" <<'PY'
          import hashlib, pathlib, re, sys
          ver = sys.argv[1]
          assets = ["fpcloud-darwin-arm64", "fpcloud-darwin-amd64", "fpcloud-linux-arm64", "fpcloud-linux-amd64"]
          hexd = {}
          for a in assets:
              digest = hashlib.sha256(pathlib.Path(a).read_bytes()).digest()
              hexd[a] = digest.hex()

          def rewrite(path, asset_re, hash_re, hashes, version_re, version_repl):
              lines = pathlib.Path(path).read_text().splitlines(keepends=True)
              out, pend = [], None
              for ln in lines:
                  if re.search(version_re, ln):
                      out.append(re.sub(version_re, version_repl, ln)); continue
                  m = re.search(asset_re, ln)
                  if m and m.group(1) in hashes:
                      pend = m.group(1); out.append(ln); continue
                  if pend and re.search(hash_re, ln):
                      out.append(re.sub(hash_re, hashes[pend], ln, count=1)); pend = None; continue
                  out.append(ln)
              pathlib.Path(path).write_text("".join(out))

          # Homebrew: `url ".../fpcloud-<os>-<arch>"` then `sha256 "<hex>"`.
          rewrite("Formula/fpcloud.rb",
                  r'/(fpcloud-[a-z0-9-]+)"', r'sha256 "[^"]*"',
                  {a: f'sha256 "{h}"' for a, h in hexd.items()},
                  r'version "[^"]*"', f'version "{ver}"')
          # Nix builds from source, so only the version moves — no asset hashes.
          # On main only; the tagged commit already carries it (#859).
          pathlib.Path("package.nix").write_text(
              re.sub(r'version = "[^"]*"', f'version = "{ver}"',
                     pathlib.Path("package.nix").read_text(), count=1))
          PY
          git add Formula/fpcloud.rb package.nix
          git commit -m "fpcloud ${TAG} formula"
          # No `|| echo` here on purpose: a rejected push is how the formula went
          # a release stale in silence (#859), so it fails the job instead.
          git push origin HEAD:main

  # Post the release notes to Slack on every successful release.
  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release]
    if: success()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
    steps:
      - name: Get release notes
        id: release
        if: env.SLACK_WEBHOOK != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          result-encoding: string
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.ref.replace('refs/tags/', '')
            });
            return release.data.body || 'No release notes provided.';
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('New release: fpcloud {0}', github.ref_name)) }},
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ${{ toJSON(format('fpcloud {0} released', github.ref_name)) }},
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(steps.release.outputs.result) }}
                  }
                }
              ]
            }

  notify-failure:
    name: Notify Release Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [release]
    if: failure()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
    steps:
      - name: Send failure notification
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          webhook: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ${{ toJSON(format('Release failed: fpcloud {0}', github.ref_name)) }},
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ${{ toJSON(format('❌ fpcloud {0} release failed', github.ref_name)) }},
                    "emoji": true
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                    }
                  ]
                }
              ]
            }
