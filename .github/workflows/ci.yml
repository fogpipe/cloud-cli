name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Symbol-level: red for a vulnerability on a path this code calls, quiet
      # for one in a module it merely carries. A fresh advisory turns main red
      # with no commit behind it, which is when the bump is owed
      # (fogpipe/cloud-workspace#340).
      - name: no vulnerability on a path the code calls
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # A formatting drift here is a diff in every later PR, and this repo takes
      # no contributions that would catch it in review.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      # The binary carries the notices its dependencies' licences require, and a
      # generated file goes stale on the next `go get` — a stale attribution
      # being the same breach wearing a fix. Regenerating here is what makes
      # adding a dependency without attributing it fail the build.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: third-party licenses are attributed
        run: deno run --allow-read --allow-run --allow-env scripts/third-party-licenses.ts --check

  # package.nix states a vendorHash over the module set in go.sum, and nothing
  # above reads it: the Go steps resolve go.sum themselves, and the release
  # recipe stamps only the version. Building the vendor derivation is what makes
  # a go.sum change without a hash change fail here, at the commit that made
  # it, instead of in every nix consumer's dev shell for a week
  # (fogpipe/cloud-workspace#1004). Only the vendor derivation: it is the one
  # thing the hash guards, and the binary itself is built by the job above.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: package.nix vendorHash matches go.sum
        run: nix build --no-link --print-build-logs '.#fpcloud.goModules'
